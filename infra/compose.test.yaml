name: hairmate-baseline-test
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: hairmate_test
      POSTGRES_DB: hairmate_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hairmate_test -d hairmate_test"]
      interval: 2s
      timeout: 2s
      retries: 20
    # Disposable local test database, no persistent or host-mounted data.
